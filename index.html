<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b1730">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>Japnish Paints — Premium Partner App</title>

<link rel="stylesheet" href="style.css?v=68.0">
</head>

<body>

<div id="app"></div>

<!-- Splash -->
<div id="splash" class="jp-splash" aria-hidden="true"></div>

<!-- Update Modal -->
<div id="jpUpdateModal" class="jp-update-modal" hidden>
  <div class="jp-update-card">

    <div class="jp-update-icon">↻</div>

    <h2>New Update Available</h2>

    <p id="jpUpdateText">
      A newer version of Japnish Paints App is available.
    </p>

    <button id="jpUpdateBtn" type="button">
      Update Now
    </button>

    <button id="jpUpdateLater" type="button">
      Later
    </button>

  </div>
</div>

<!-- App Configuration -->
<script src="config.js?v=68"></script>

<!-- QR Scanner -->
<script
  src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"
  defer>
</script>

<!-- Main App -->
<script src="app.js?v=68.0" defer></script>

<!-- Auto Update -->
<script src="app-update.js?v=1.0" defer></script>

</body>
</html>
