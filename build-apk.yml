name: Build Japnish Paints APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java 21
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare web app
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp app.js www/
          cp config.js www/
          cp index.html www/
          cp style.css www/
          cp manifest.json www/
          cp app-update.js www/

          if [ -f "japnish-dashboard-logo.png" ]; then
            cp japnish-dashboard-logo.png www/
          fi

          if [ -f "japnish-logo.png" ]; then
            cp japnish-logo.png www/
          elif [ -f "japnish-dashboard-logo.png" ]; then
            cp japnish-dashboard-logo.png www/japnish-logo.png
          fi

          if [ -f "dashboard-brand-fix.css" ]; then
            cp dashboard-brand-fix.css www/
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/config.js")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              'UPDATE_VERSION_URL: "/mobile/app-version.php"',
              'UPDATE_VERSION_URL: "https://japnishpaints.store/mobile/app-version.php"'
          )

          s = s.replace(
              'APK_DOWNLOAD_URL: "/mobile/app/JapnishPaints.apk"',
              'APK_DOWNLOAD_URL: "https://japnishpaints.store/mobile/app/JapnishPaints.apk"'
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy Android resources
        shell: bash
        run: |
          set -e

          if [ -d "android-res" ]; then
            cp -R android-res/. android/app/src/main/res/
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Gradle Java 21
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -e

          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "=== FINAL JAVA ==="
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/JapnishPaints-v68.0.3-debug.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JapnishPaints-APK
          path: release/JapnishPaints-v68.0.3-debug.apk
