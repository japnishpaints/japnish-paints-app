name: Build Japnish Paints APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www

          cp app.js www/
          cp config.js www/
          cp index.html www/
          cp style.css www/
          cp manifest.json www/
          cp app-update.js www/

          # Optional branding assets
          if [ -f japnish-logo.png ]; then
            cp japnish-logo.png www/
          fi

          if [ -f japnish-dashboard-logo.png ]; then
            cp japnish-dashboard-logo.png www/
          fi

          if [ -f dashboard-brand-fix.css ]; then
            cp dashboard-brand-fix.css www/
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/config.js")
          s = p.read_text()

          s = s.replace(
              'UPDATE_VERSION_URL: "/mobile/app-version.php"',
              'UPDATE_VERSION_URL: "https://japnishpaints.store/mobile/app-version.php"'
          )

          s = s.replace(
              'APK_DOWNLOAD_URL: "/mobile/app/JapnishPaints.apk"',
              'APK_DOWNLOAD_URL: "https://japnishpaints.store/mobile/app/JapnishPaints.apk"'
          )

          p.write_text(s)

          # Load dashboard branding CSS if it exists
          index = Path("www/index.html")
          html = index.read_text()

          if (
              Path("www/dashboard-brand-fix.css").exists()
              and "dashboard-brand-fix.css" not in html
          ):
              html = html.replace(
                  "</head>",
                  '<link rel="stylesheet" href="dashboard-brand-fix.css?v=68.0.4"></head>'
              )

          index.write_text(html)
          PY

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy Android branding resources
        run: |
          if [ -d android-res ]; then
            cp -R android-res/. android/app/src/main/res/
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/JapnishPaints-v68.0.4-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JapnishPaints-APK
          path: release/JapnishPaints-v68.0.4-debug.apk
